[project]
name = "terminal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "apprise>=1.13.1",
    "apscheduler<4",
    "arch>=8.0.0",
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.5",
    "edgartools>=5.58.0",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "greenlet>=3.5.6",
    "html5lib>=1.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sdmx1>=2.27.0",
    "sqlalchemy>=2",
    "statsmodels>=0.15.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
    "xlrd>=2.0.2",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"backend/migrations/**" = ["E402", "F401"]
