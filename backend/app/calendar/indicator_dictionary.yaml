# Vendor / official release names -> canonical event keys.
# Lookup is per country: normalize(name) (lower-case, m/m->mom, y/y->yoy, q/q->qoq, punctuation stripped).
# `release_names` match official release families (FRED releases, BLS ICS "<release> for <Month YYYY>", BEA).
# `headline_series` + `headline_transform` define the ALFRED first-print actual (transform of the vintage series' last obs).
# period_rule: prev_month | prev_quarter | prev_week | none  (reference period relative to the release date)
currency_to_country:
  USD: US
  ILS: IL
  EUR: EA
  GBP: GB
  JPY: JP
  CNY: CN
  CAD: CA
  CHF: CH
  AUD: AU
  NZD: NZ

country_names:
  US: [united states, usa, us]
  IL: [israel, il]
  EA: [euro area, eurozone, euro zone, eu, ea, ez, european union]
  DE: [germany, de]
  GB: [united kingdom, uk, gb, britain]
  JP: [japan, jp]
  CN: [china, cn]
  CA: [canada, ca]
  CH: [switzerland, ch]
  AU: [australia, au]

